services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: rendezvous
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password}
      POSTGRES_DB: rendezvous
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rendezvous]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rendezvous:${POSTGRES_PASSWORD}@db:5432/rendezvous
      PUBLIC_URL: https://${FRONTEND_DOMAIN:?Set your frontend domain}
      FRONTEND_URL: https://${FRONTEND_DOMAIN}
      TRUST_PROXY: uniquelocal
    volumes:
      - secrets:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      EXPRESS_URL: http://app:3000
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  postgres:
  secrets:
